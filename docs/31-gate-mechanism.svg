<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="680" height="470" rx="10" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">双指数确认闸门（道氏 × A判据，全价格结构、零均线）</text>

  <!-- 输入层 -->
  <rect x="30" y="58" width="180" height="64" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">大盘代表：sh000001</text>
  <text x="120" y="98" text-anchor="middle" font-size="10.5" fill="#475569">1990 起 · docs/26 判别力已验</text>
  <rect x="30" y="140" width="180" height="64" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="162" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">中小盘代表：sh000905</text>
  <text x="120" y="180" text-anchor="middle" font-size="10.5" fill="#475569">2005 起（源库已验）· 或 sz399001</text>
  <text x="120" y="196" text-anchor="middle" font-size="10" fill="#6366f1">创业板指 2010 起 → 只作敏感性</text>

  <!-- 状态判定层 -->
  <rect x="250" y="86" width="150" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="325" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">每指数独立 A 判据</text>
  <text x="325" y="126" text-anchor="middle" font-size="10" fill="#334155">60日低点相邻日比</text>
  <text x="325" y="141" text-anchor="middle" font-size="10" fill="#334155">&gt;×1.002 升 / &lt;×0.998 降</text>
  <text x="325" y="158" text-anchor="middle" font-size="9.5" fill="#059669">箱体语言连续化 · 合宪</text>
  <line x1="210" y1="90" x2="248" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="210" y1="172" x2="248" y2="146" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 确认矩阵 -->
  <text x="480" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">确认状态（道氏：必须相互确认）</text>
  <g font-size="10.5">
    <rect x="420" y="78" width="120" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="480" y="99" text-anchor="middle" fill="#7f1d1d" font-weight="700">双降确认</text>
    <rect x="420" y="118" width="120" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="480" y="139" text-anchor="middle" fill="#713f12" font-weight="700">单降背离（一升一降）</text>
    <rect x="420" y="158" width="120" height="34" rx="6" fill="#d1fae5" stroke="#16a34a"/>
    <text x="480" y="179" text-anchor="middle" fill="#14532d" font-weight="700">双升确认</text>
    <rect x="420" y="198" width="120" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="480" y="217" text-anchor="middle" fill="#475569">其余（震荡组合）</text>
  </g>
  <line x1="400" y1="132" x2="418" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 动作层 -->
  <g font-size="10.5">
    <rect x="566" y="78" width="94" height="34" rx="6" fill="#dc2626"/>
    <text x="613" y="99" text-anchor="middle" fill="#ffffff" font-weight="700">停手 / 0.5 单位</text>
    <rect x="566" y="118" width="94" height="34" rx="6" fill="#16a34a"/>
    <text x="613" y="139" text-anchor="middle" fill="#ffffff" font-weight="700">豁免 · 不动作</text>
    <rect x="566" y="158" width="94" height="34" rx="6" fill="#16a34a"/>
    <text x="613" y="179" text-anchor="middle" fill="#ffffff" font-weight="700">正常 E17 阶梯</text>
    <rect x="566" y="198" width="94" height="30" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="613" y="217" text-anchor="middle" fill="#475569">半仓？（A类后验定）</text>
  </g>
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="540" y1="95" x2="564" y2="95" marker-end="url(#arr)"/>
    <line x1="540" y1="135" x2="564" y2="135" marker-end="url(#arr)"/>
    <line x1="540" y1="175" x2="564" y2="175" marker-end="url(#arr)"/>
    <line x1="540" y1="213" x2="564" y2="213" marker-end="url(#arr)"/>
  </g>

  <!-- 证据映射带 -->
  <rect x="30" y="252" width="630" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="278" font-size="12.5" font-weight="700" fill="#0f172a">9 年回测证据 → 新机制逐格对号（机制推演，待 A 类验证）</text>
  <g font-size="10.5" fill="#334155">
    <text x="48" y="302">▸ 2008/2011 双杀年（+68,650 / +52,704）→ 双降确认触发 → <tspan fill="#dc2626" font-weight="700">保护全保留</tspan></text>
    <text x="48" y="324">▸ 2013 沪弱深强（−67,174 唯一重伤年）→ 落入"单降背离" → <tspan fill="#16a34a" font-weight="700">自动豁免，误伤清零</tspan></text>
    <text x="48" y="346">▸ 2006/2007/2014 牛市（≈0 代价）→ 双升确认 → 阶梯照常，零干预</text>
    <text x="48" y="368">▸ 2012 双弱横盘（+157 白干）→ 双降触发但无 edge 可挡 → 与 MA60 同行为，无新增伤害</text>
    <text x="48" y="390">▸ 2005 熊末牛初（+5,353）→ 双降→牛初切换 → 豁免或比 MA60 早一拍（待验）</text>
  </g>
  <text x="48" y="418" font-size="10" fill="#94a3b8">纪律：以上对号全部是机制推演，须先 A 类零成本后验（1328 笔 × 双指数状态分桶），显著才立项 B-3。</text>
  <text x="48" y="438" font-size="10" fill="#94a3b8">历史警告：docs/23 §9 P5 曾六轮证伪 C 判据闸门（−28k~−58k）——这是第三种口径，不许拿 B-2 胜利外推。</text>
</svg>
