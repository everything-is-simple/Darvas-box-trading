<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="680" height="470" rx="10" fill="#f8fafc"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">B-2 stop 闸门逐年净改善（2005–2014，已出结果的 10 年）</text>

  <!-- 图例 -->
  <g font-size="10.5">
    <rect x="500" y="38" width="10" height="10" fill="#dc2626"/>
    <text x="515" y="47" fill="#334155">改善（省/赚）</text>
    <rect x="590" y="38" width="10" height="10" fill="#16a34a"/>
    <text x="605" y="47" fill="#334155">受损</text>
  </g>

  <!-- 零轴 -->
  <line x1="48" y1="200" x2="648" y2="200" stroke="#475569" stroke-width="1.5"/>

  <!-- 柱：scale 155px=70000 -->
  <!-- 2005 +5,353 h=12 -->
  <rect x="60" y="188" width="40" height="12" fill="#dc2626"/>
  <text x="80" y="181" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">+5,353</text>
  <!-- 2006 -1,397 h=3 -->
  <rect x="119" y="200" width="40" height="3" fill="#16a34a"/>
  <text x="139" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">−1,397</text>
  <!-- 2007 0 -->
  <rect x="178" y="199" width="40" height="2" fill="#94a3b8"/>
  <text x="198" y="192" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">0</text>
  <!-- 2008 +68,650 h=152 -->
  <rect x="237" y="48" width="40" height="152" fill="#dc2626"/>
  <text x="257" y="41" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">+68,650</text>
  <!-- 2009 +43,073 h=95 -->
  <rect x="296" y="105" width="40" height="95" fill="#dc2626"/>
  <text x="316" y="98" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">+43,073</text>
  <!-- 2010 +56,357 h=125 -->
  <rect x="355" y="75" width="40" height="125" fill="#dc2626"/>
  <text x="375" y="68" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">+56,357</text>
  <!-- 2011 +52,704 h=117 -->
  <rect x="414" y="83" width="40" height="117" fill="#dc2626"/>
  <text x="434" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">+52,704</text>
  <!-- 2012 +157 h=1 -->
  <rect x="473" y="199" width="40" height="1" fill="#94a3b8"/>
  <text x="493" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">+157</text>
  <!-- 2013 -67,174 h=149 -->
  <rect x="532" y="200" width="40" height="149" fill="#16a34a"/>
  <text x="552" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">−67,174</text>
  <!-- 2014 -723 h=2 -->
  <rect x="591" y="200" width="40" height="2" fill="#16a34a"/>
  <text x="611" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">−723</text>

  <!-- 年份与市况标签 -->
  <g font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">
    <text x="80" y="382">2005</text><text x="139" y="382">2006</text><text x="198" y="382">2007</text>
    <text x="257" y="382">2008</text><text x="316" y="382">2009</text><text x="375" y="382">2010</text>
    <text x="434" y="382">2011</text><text x="493" y="382">2012</text><text x="552" y="382">2013</text>
    <text x="611" y="382">2014</text>
  </g>
  <g font-size="9.5" fill="#64748b" text-anchor="middle">
    <text x="80" y="398">熊末</text><text x="139" y="398">大牛</text><text x="198" y="398">牛</text>
    <text x="257" y="398">深熊·双杀</text><text x="316" y="398">反弹</text><text x="375" y="398">震荡</text>
    <text x="434" y="398">阴跌</text><text x="493" y="398">双弱横盘</text><text x="552" y="398">小盘牛·脱钩</text>
    <text x="611" y="398">牛启</text>
  </g>

  <!-- 注释 -->
  <text x="552" y="344" text-anchor="middle" font-size="9.5" fill="#166534">沪弱深强：唯一重伤年，新设计的靶心</text>
  <text x="257" y="60" text-anchor="middle" font-size="9.5" fill="#991b1b">双降确认的主场</text>

  <!-- 底部结论 -->
  <rect x="30" y="416" width="630" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="434" font-size="10.5" fill="#334155">模式：亏损年大额减亏（+5k ~ +68k）· 盈利年近零代价（0 ~ −1.4k）· 一个脱钩年重伤（−67k）</text>
  <text x="48" y="450" font-size="10.5" fill="#334155">累计 +157,000（10/14 年，尚余 2015–2018 四跑）。改善是「保险」不是「择时」：只在有负 edge 的年份收保费。</text>
</svg>
